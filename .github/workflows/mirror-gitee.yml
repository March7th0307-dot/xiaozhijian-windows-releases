name: 同步到 Gitee 备用源
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 要同步的版本标签，例如 v1.2.3
        required: true
permissions:
  contents: read
concurrency:
  group: gitee-mirror
  cancel-in-progress: false
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github
      - name: 同步
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PLATFORM: windows
        run: python3 .github/gitee_mirror.py "$PLATFORM" "$TAG"
