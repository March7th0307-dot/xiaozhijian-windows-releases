name: Windows isolated live update check
on:
  push:
    branches: [qa/native-input-20261114]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download published version and verify
        shell: pwsh
        run: |
          $uri = 'https://github.com/March7th0307-dot/xiaozhijian-windows-releases/releases/download/v1.0.1/Xiaozhijian-Setup.exe'
          & curl.exe -fLsS $uri -o candidate.exe
          if ($LASTEXITCODE -ne 0) { throw 'Download failed' }
          if ((Get-FileHash candidate.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '27b008059b11014efe428fbd6efb6b3a86aef051c5065c21e09b5f21bcd609b2') { throw 'Candidate hash mismatch' }
          $p = Start-Process -FilePath (Resolve-Path candidate.exe) -ArgumentList '--install-only' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          "QA_APP_EXE=$(Join-Path $env:LOCALAPPDATA 'Xiaozhijian\current\Xiaozhijian.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'writer-native-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test native input and live update check
        shell: pwsh
        run: node qa/windows-native-input.js
      - name: Save synthetic desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-live-latest-check
          path: ${{ runner.temp }}/writer-native-artifacts
          if-no-files-found: ignore
          retention-days: 7
