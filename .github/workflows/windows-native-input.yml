name: Windows isolated native input QA
on:
  push:
    branches: [qa/native-input-20261114]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  native:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Inspect Microsoft Pinyin availability on disposable runner
        shell: pwsh
        run: |
          Get-WinUserLanguageList | Select-Object LanguageTag,InputMethodTips | ConvertTo-Json -Depth 4
          Get-WindowsCapability -Online | Where-Object { $_.Name -like 'Language.Basic~~~zh-CN*' } | Select-Object Name,State | ConvertTo-Json -Compress
      - name: Try official Chinese language pack on disposable runner
        shell: powershell
        timeout-minutes: 4
        continue-on-error: true
        run: |
          $ErrorActionPreference = 'Stop'
          $result = Add-WindowsCapability -Online -Name 'Language.Basic~~~zh-CN~0.0.1.0'
          $result | ConvertTo-Json -Compress
          $langs = Get-WinUserLanguageList
          if (-not ($langs | Where-Object LanguageTag -eq 'zh-CN')) { $langs.Add('zh-CN') }
          Set-WinUserLanguageList $langs -Force
          Get-WinUserLanguageList | Select-Object LanguageTag,InputMethodTips | ConvertTo-Json -Depth 4
      - name: Download verified unpublished test candidate
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $uri = 'https://api.github.com/repos/March7th0307-dot/xiaozhijian-windows-releases/releases/assets/744190298'
          & curl.exe -fLsS -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' $uri -o candidate.exe
          if ($LASTEXITCODE -ne 0) { throw 'Candidate download failed' }
          if ((Get-FileHash candidate.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '27b008059b11014efe428fbd6efb6b3a86aef051c5065c21e09b5f21bcd609b2') { throw 'Candidate hash mismatch' }
          $p = Start-Process -FilePath (Resolve-Path candidate.exe) -ArgumentList '--install-only' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw 'Install failed' }
          "QA_APP_EXE=$(Join-Path $env:LOCALAPPDATA 'Xiaozhijian\current\Xiaozhijian.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'writer-native-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Run native mouse and keyboard test
        shell: pwsh
        run: node qa/windows-native-input.js
      - name: Save native desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-input-evidence
          path: ${{ runner.temp }}/writer-native-artifacts
          if-no-files-found: ignore
          retention-days: 7
