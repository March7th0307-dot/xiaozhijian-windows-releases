name: Isolated Windows candidate QA
on:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download unpublished candidate and verify its hash
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $asset = 'https://api.github.com/repos/March7th0307-dot/xiaozhijian-windows-releases/releases/assets/744190298'
          & curl.exe -fLsS -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' $asset -o candidate.exe
          if ($LASTEXITCODE -ne 0) { throw 'Failed to retrieve candidate asset' }
          if ((Get-FileHash candidate.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '27b008059b11014efe428fbd6efb6b3a86aef051c5065c21e09b5f21bcd609b2') { throw 'Candidate SHA-256 mismatch' }
      - name: Install and verify all installed files
        shell: pwsh
        run: |
          $installer = Start-Process -FilePath (Resolve-Path candidate.exe) -ArgumentList '--install-only' -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer failed: $($installer.ExitCode)" }
          $root = Join-Path $env:LOCALAPPDATA 'Xiaozhijian\current'
          $inv = Get-Content -Raw -LiteralPath (Join-Path $root '.xiaozhijian-files.json') | ConvertFrom-Json
          $items = @($inv.files.PSObject.Properties)
          if ($items.Count -lt 100) { throw "Inventory unexpectedly short: $($items.Count)" }
          foreach ($item in $items) {
            if ($item.Name -match '(^/|\.\.|\\|:)') { throw 'Unsafe inventory path' }
            $file = Join-Path $root $item.Name
            if ((Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() -ne $item.Value.ToLowerInvariant()) { throw "Installed hash mismatch: $($item.Name)" }
          }
          Write-Host "Verified installed files: $($items.Count)"
          "QA_APP_EXE=$(Join-Path $root 'Xiaozhijian.exe')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'writer-qa-artifacts')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test actual application with synthetic data
        shell: pwsh
        run: node qa/windows-smoke.js
      - name: Download signed update replay artifacts
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'writer-replay-artifacts'
          New-Item -ItemType Directory -Path $base | Out-Null
          $assets = @(
            @{ id='744304109'; name='update.json'; hash='5f6d388f39c768bdcdbe27c928bfd267bef6005b61c710207f66b017a8cad089' },
            @{ id='744304108'; name='xiaozhijian-windows.zip'; hash='edf71b27c08d95754b616594d730c769e3c3da972840c6b0006b1a84c9173231' }
          )
          foreach ($a in $assets) {
            $url = "https://api.github.com/repos/March7th0307-dot/xiaozhijian-windows-releases/releases/assets/$($a.id)"
            $target = Join-Path $base $a.name
            & curl.exe -fLsS -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' $url -o $target
            if ($LASTEXITCODE -ne 0) { throw "Failed to retrieve $($a.name)" }
            if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne $a.hash) { throw "Hash mismatch for $($a.name)" }
          }
          "QA_REPLAY_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Test signed update transaction with synthetic data
        shell: pwsh
        run: node qa/windows-update-replay.js
      - name: Save synthetic screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-candidate-synthetic-qa
          path: ${{ runner.temp }}/writer-qa-artifacts
          if-no-files-found: ignore
          retention-days: 7
