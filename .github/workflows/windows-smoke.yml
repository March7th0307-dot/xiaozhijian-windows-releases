name: Windows synthetic screenshot QA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download unpublished candidate and verify hash
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $url = 'https://api.github.com/repos/March7th0307-dot/xiaozhijian-windows-releases/releases/assets/744190298'
          & curl.exe -fLsS -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' $url -o candidate.exe
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve candidate' }
          if ((Get-FileHash candidate.exe -Algorithm SHA256).Hash.ToLowerInvariant() -ne '27b008059b11014efe428fbd6efb6b3a86aef051c5065c21e09b5f21bcd609b2') { throw 'Candidate hash mismatch' }
      - name: Install candidate to ephemeral user directory
        shell: pwsh
        run: |
          $p = Start-Process -FilePath (Resolve-Path candidate.exe) -ArgumentList '--install-only' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Install failed: $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA 'Xiaozhijian\current\Xiaozhijian.exe'
          if (!(Test-Path -LiteralPath $exe)) { throw 'Installed app missing' }
          "QA_APP_EXE=$exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "QA_ARTIFACTS=$(Join-Path $env:RUNNER_TEMP 'writer-synthetic-screens')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Capture synthetic Windows app pages
        shell: pwsh
        run: node qa/screenshots.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-synthetic-page-screens
          path: ${{ runner.temp }}/writer-synthetic-screens
          if-no-files-found: ignore
          retention-days: 7
