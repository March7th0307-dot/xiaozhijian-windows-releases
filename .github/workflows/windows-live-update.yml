name: Isolated Windows Live Update QA
on:
  workflow_dispatch:
jobs:
  live-update:
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated baseline using exact signed draft archive
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'writer-live-qa-baseline'
          New-Item -ItemType Directory -Path $base | Out-Null
          $url = 'https://api.github.com/repos/March7th0307-dot/xiaozhijian-windows-releases/releases/assets/744304108'
          $target = Join-Path $base 'xiaozhijian-windows.zip'
          & curl.exe -fLsS -H 'Accept: application/octet-stream' -H "Authorization: Bearer $env:GH_TOKEN" -H 'X-GitHub-Api-Version: 2022-11-28' $url -o $target
          if ($LASTEXITCODE -ne 0) { throw 'Failed to retrieve baseline archive' }
          if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'edf71b27c08d95754b616594d730c769e3c3da972840c6b0006b1a84c9173231') { throw 'Baseline archive hash mismatch' }
          "QA_REPLAY_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise actual HTTPS download and signed update on isolated data
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: node qa/windows-live-update.js
