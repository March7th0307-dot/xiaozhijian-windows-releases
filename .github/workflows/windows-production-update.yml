name: Isolated Windows Production Update QA
on:
  push:
    branches: [qa/windows-production-update-20261114]
jobs:
  production-update:
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare isolated baseline from public release
        shell: pwsh
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'writer-production-qa-baseline'
          New-Item -ItemType Directory -Path $base | Out-Null
          $url = 'https://github.com/March7th0307-dot/xiaozhijian-windows-releases/releases/download/v1.0.1/xiaozhijian-windows.zip'
          $target = Join-Path $base 'xiaozhijian-windows.zip'
          & curl.exe -fLsS $url -o $target
          if ($LASTEXITCODE -ne 0) { throw 'Could not retrieve public baseline archive' }
          if ((Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'edf71b27c08d95754b616594d730c769e3c3da972840c6b0006b1a84c9173231') { throw 'Baseline archive hash mismatch' }
          "QA_REPLAY_BASE=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Exercise unchanged production HTTPS updater on isolated data
        shell: pwsh
        run: node qa/windows-production-update.js
